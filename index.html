<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>제63회 전국도서관대회 업무 현황판</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- 로그인 화면 -->
<div id="loginScreen" style="display:flex;position:fixed;inset:0;background:#1E3A5F;z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:16px;padding:40px;width:360px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;">
    <div style="font-size:2rem;margin-bottom:8px;">📚</div>
    <div style="font-size:1.15rem;font-weight:900;color:#1E3A5F;margin-bottom:4px;">전국도서관대회</div>
    <div style="font-size:.8rem;color:#64748B;margin-bottom:28px;">제63회 업무 현황판</div>
    <input id="loginId" type="email" placeholder="이메일" autocomplete="username"
      style="width:100%;padding:11px 14px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:.92rem;margin-bottom:10px;outline:none;box-sizing:border-box;font-family:inherit;">
    <input id="loginPw" type="password" placeholder="비밀번호" autocomplete="current-password"
      style="width:100%;padding:11px 14px;border:1.5px solid #E2E8F0;border-radius:8px;font-size:.92rem;margin-bottom:6px;outline:none;box-sizing:border-box;font-family:inherit;">
    <div id="loginErr" style="color:#DC2626;font-size:.78rem;margin-bottom:10px;min-height:18px;"></div>
    <button id="loginBtn"
      style="width:100%;padding:12px;background:#1E3A5F;color:#fff;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;font-family:inherit;">
      로그인
    </button>
  </div>
</div>

<!-- 헤더 -->
<header class="site-header">
  <div>
    <h1>제63회 전국도서관대회 — 주차별 업무 현황판</h1>
    <div class="sub">개최일: 2026. 10. 28.(수)~10. 30.(금)&nbsp;|&nbsp;김대중컨벤션센터(광주)</div>
  </div>
  <div class="header-meta">
    <span class="badge-sm badge-h">● 협회</span>
    <span class="badge-sm badge-y">● 용역사</span>
    <span class="badge-sm badge-b">● 공동</span>
  </div>
</header>

<!-- 달력 -->
<div class="cal-section">
  <h2>📅 월별 빠른 탐색</h2>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-panel" id="calPanel">
    <div class="cal-panel-header">
      <h3 id="calPanelTitle"></h3>
      <button class="cal-panel-close" id="calPanelClose">✕</button>
    </div>
    <div class="cal-panel-body" id="calPanelBody"></div>
  </div>
</div>

<!-- 진행중 업무 섹션 (달력과 필터 사이) -->
<div id="inProgressSection" class="in-progress-section" style="display:none">
  <div class="in-progress-header">
    <span class="in-progress-badge">⏳ 진행중</span>
    <span id="inProgressCount" class="in-progress-count"></span>
    <span class="in-progress-label">건이 현재 진행중입니다</span>
    <button class="ip-toggle" id="ipToggleTop" title="접기/펼치기" onclick="toggleInProgress()">▲</button>
  </div>
  <div id="inProgressBody" class="in-progress-body"></div>
  <div class="in-progress-footer" id="ipFooter">
    <button class="ip-toggle ip-toggle-bottom" title="접기" onclick="toggleInProgress()">▲ 접기</button>
  </div>
</div>

<!-- 필터 + 추가 버튼 -->
<div class="filter-bar">
  <span class="fb-label">필터:</span>
  <button class="filter-btn active" data-f="all">전체</button>
  <button class="filter-btn fh" data-f="h">협회</button>
  <button class="filter-btn fy" data-f="y">용역사</button>
  <button class="filter-btn fb" data-f="b">공동</button>
  <button class="add-task-btn" id="openModalBtn">＋ 업무 추가</button>
</div>

<!-- 업무 추가/수정 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>✏️ 업무 추가</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <label>담당 구분</label>
        <div class="type-row">
          <button class="type-btn" data-type="h">협회</button>
          <button class="type-btn" data-type="y">용역사</button>
          <button class="type-btn" data-type="b">공동</button>
        </div>
      </div>
      <div class="form-row">
        <label>주차 선택</label>
        <select id="formWeek"></select>
      </div>
      <div class="form-row">
        <label>업무 내용</label>
        <textarea id="formText" placeholder="업무 내용을 입력하세요" rows="2"></textarea>
      </div>
      <div class="form-row">
        <label>일정 (선택)</label>
        <input type="text" id="formDate" placeholder="예: 8/7(금)~8/28(금)">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" id="modalCancel">취소</button>
      <button class="btn-save" id="modalSave">추가하기</button>
    </div>
  </div>
</div>

<!-- 메인 콘텐츠 -->
<main class="main" id="main"></main>

<script type="module" src="assets/app.js"></script>
</body>
</html>
